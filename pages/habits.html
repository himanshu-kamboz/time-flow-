<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <title>Habits | TimeFlow</title>
</head>

<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><img src="../images/logo.png" alt="TimeFlow" /><span>TimeFlow</span></a>
      <div class="workspace-switcher">
        <span class="workspace-mark">T</span><span><b>Personal space</b><small>Private workspace</small></span><svg
          viewBox="0 0 24 24">
          <path d="m7 10 5 5 5-5" />
        </svg>
      </div>
      <div class="nav-label">Workspace</div>
      <nav class="app-nav">
        <a class="nav-link" href="dashboard.html"><svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg><span>Dashboard</span></a><a class="nav-link" href="schedule.html"><svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="17" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg><span>Schedule</span></a><a class="nav-link" href="tasks.html"><svg viewBox="0 0 24 24">
            <path d="m5 12 4 4L19 6" />
            <path d="M4 4h7M4 20h16" />
          </svg><span>Tasks</span></a><a class="nav-link" href="focus.html"><svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="3" />
          </svg><span>Focus</span></a><a class="nav-link" href="analytics.html"><svg viewBox="0 0 24 24">
            <path d="M4 19V5M4 19h17M7 15l3-4 3 2 5-7" />
          </svg><span>Analytics</span></a><a class="nav-link" href="goals.html"><svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="4" />
          </svg><span>Goals</span></a><a class="nav-link active" href="habits.html"><svg viewBox="0 0 24 24">
            <path d="M12 21a8 8 0 1 1 8-8c0 4-2 7-6 8M12 17v-5l3-3" />
          </svg><span>Habits</span></a>
      </nav>
    </aside>
    <main class="app-content">
      <header class="topbar">
        <div>
          <div class="time-date">
            <p id="current-date" class="greeting"></p>
            <p id="current-time" class="greeting"></p>
          </div>
          <p class="greeting">Consistency compounds</p>
          <h1 class="page-title">Habits</h1>
        </div>
        <button class="button-primary" data-add-habit>＋ Add habit</button>
      </header>
      <section class="panel">
        <div class="section-heading">
          <h2>Daily habits</h2>
          <span class="pill" data-habit-streak>0 day streak</span>
        </div>
        <div data-habits-list></div>
      </section>
      
        
    </main>
  </div>
  <script src="../js/main.js"></script>
</body>

</html>
