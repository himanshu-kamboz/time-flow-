<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Habits | TimeFlow</title>
</head>

<body class="app-body">
    <div class="app-shell">
        <aside class="sidebar"><a class="brand" href="dashboard.html"><img src="../images/logo.png"
                    alt="TimeFlow"><span>TimeFlow</span></a>
            <div class="nav-label">Workspace</div>
            <nav class="app-nav"><a class="nav-link" href="dashboard.html"><span>⌂</span><span>Dashboard</span></a><a
                    class="nav-link" href="schedule.html"><span>◷</span><span>Schedule</span></a><a class="nav-link"
                    href="tasks.html"><span>✓</span><span>Tasks</span></a><a class="nav-link"
                    href="focus.html"><span>◉</span><span>Focus</span></a><a class="nav-link"
                    href="analytics.html"><span>◌</span><span>Analytics</span></a><a class="nav-link"
                    href="goals.html"><span>↗</span><span>Goals</span></a><a class="nav-link active"
                    href="habits.html"><span>⌁</span><span>Habits</span></a></nav>
        </aside>
        <main class="app-content">
            <header class="topbar">
                <div>
                    <p class="greeting">Consistency compounds</p>
                    <h1 class="page-title">Habits</h1>
                </div><button class="button-primary">＋ Add habit</button>
            </header>
            <section class="panel">
                <div class="section-heading">
                    <h2>Daily habits</h2><span class="pill">6 day streak</span>
                </div>
                <div class="habit-item"><strong>Morning movement</strong>
                    <div class="progress width-86"><span></span></div>
                    <div class="goal-meta"><span>6 day streak</span><span>Today complete</span></div>
                </div>
                <div class="habit-item"><strong>Read 20 minutes</strong>
                    <div class="progress width-71"><span></span></div>
                    <div class="goal-meta"><span>4 day streak</span><span>Today complete</span></div>
                </div>
                <div class="habit-item"><strong>Plan tomorrow</strong>
                    <div class="progress width-57"><span></span></div>
                    <div class="goal-meta"><span>3 day streak</span><span>Due tonight</span></div>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/main.js"></script>
</body>

</html>
