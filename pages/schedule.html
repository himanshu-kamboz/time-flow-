<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Schedule | TimeFlow</title>
</head>

<body class="app-body">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="dashboard.html">
                <img src="../images/logo.png" alt="TimeFlow" />
                <span>TimeFlow</span>
            </a>
            <div class="workspace-switcher">
                <span class="workspace-mark">T</span>
                <span><b>Personal space</b><small>Private workspace</small></span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m7 10 5 5 5-5" />
                </svg>
            </div>
            <div class="nav-label">Workspace</div>
            <nav class="app-nav" aria-label="Workspace navigation">
                <a class="nav-link" href="dashboard.html"><span aria-hidden="true">▦</span><span>Dashboard</span></a>
                <a class="nav-link active" href="schedule.html" aria-current="page"><span
                        aria-hidden="true">▣</span><span>Schedule</span></a>
                <a class="nav-link" href="tasks.html"><span aria-hidden="true">✓</span><span>Tasks</span></a>
                <a class="nav-link" href="focus.html"><span aria-hidden="true">◎</span><span>Focus</span></a>
                <a class="nav-link" href="analytics.html"><span aria-hidden="true">⌁</span><span>Analytics</span></a>
                <a class="nav-link" href="goals.html"><span aria-hidden="true">◎</span><span>Goals</span></a>
                <a class="nav-link" href="habits.html"><span aria-hidden="true">◔</span><span>Habits</span></a>
            </nav>
        </aside>

        <main class="app-content">
            <header class="topbar">
                <div>
                    <div class="time-date">
                        <p id="current-date" class="greeting"></p>
                        <p id="current-time" class="greeting"></p>
                    </div>
                    <h1 class="page-title">Schedule</h1>
                </div>
                <button class="button-primary" type="button" data-add-schedule>
                    ＋ Add block
                </button>
            </header>

            <section class="status-strip route-status" aria-live="polite">
                <div class="status-copy">
                    <span class="status-indicator" aria-hidden="true"></span>
                    <span>
                        <strong data-schedule-status>0 blocks planned today</strong>
                        <small data-schedule-message>Add a block to shape your day.</small>
                    </span>
                </div>
                <div class="daily-progress">
                    <div>
                        <span>Schedule filled</span><b data-schedule-progress>0%</b>
                    </div>
                    <div class="progress progress-light" aria-hidden="true">
                        <span id="schedule-page-progress"></span>
                    </div>
                </div>
                <span class="pill" data-schedule-total>0h planned</span>
            </section>

            <section class="panel" aria-labelledby="schedule-heading">
                <div class="section-heading">
                    <div>
                        <span class="section-kicker">Daily plan</span>
                        <h2 id="schedule-heading" data-schedule-date>Today</h2>
                    </div>
                    <span class="pill">Today</span>
                </div>
                <div class="timeline" data-schedule-list aria-live="polite"></div>
                <div class="schedule-footer">
                    <span><b data-schedule-focused>0h</b>Focused</span>
                    <span><b data-schedule-completion>0%</b>Complete</span>
                    <span><b data-schedule-week-total>0h scheduled</b>This plan</span>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/main.js"></script>
</body>

</html>
