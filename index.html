<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link rel="stylesheet" href="./css/style.css">
    <title> Time flow</title>
</head>

<body>
    <span id="current-date" hidden></span>
    <span id="current-time" hidden></span>
    <section class="main">
        <div class="steps active" id="step-1">
            <div class="img-form">
                <img class="logo" src="./images/logo.png" alt="logo" height="200px">
            </div>
            <div class="img-form">
                <p class="eyebrow">Step 1 out of 4</p>
                <h1>Let's go to know you</h1>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="role">What do you do?</label>
                    <select id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="student">Student</option>
                        <option value="job">Job</option>
                        <option value="nothing">Nothing</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Where are you from?</label>
                    <input type="text" id="location" name="location" placeholder="Enter your location" required>
                </div>
                <div class="btns">
                    <button class="next-btn" type="button"> Continue → </button>
                </div>
            </div>

        </div>

        <div class="steps" id="step-2">
            <div class="img-form">
                <p class="eyebrow">Step 2 out of 4</p>
                <h1>What are your priorities?</h1>
                <div class="priority-grid">

                    <label class="priority-card">
                        <input type="checkbox" value="Learning">
                        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5a3 3 0 0 1 3-2h13v17H7a3 3 0 0 0-3 3V5Z" />
                                <path d="M7 20h13M8 7h8M8 11h6" />
                            </svg></span>
                        <span>Learning</span>
                        <span class="check">✓</span>
                    </label>

                    <label class="priority-card">
                        <input type="checkbox" value="Projects">
                        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M14 5 19 3l2 2-2 5-4 4-3-3 2-6Z" />
                                <path d="m12 12-5 5M7 17H4v3h3l2-2M14 5l-3-2-3 3 4 2M19 10l2 3-3 3-2-4" />
                            </svg></span>
                        <span>Projects</span>
                        <span class="check">✓</span>
                    </label>

                    <label class="priority-card">
                        <input type="checkbox" value="Fitness">
                        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 8v8M3 10v4M8 6v12M16 6v12M19 8v8M21 10v4M8 12h8" />
                            </svg></span>
                        <span>Fitness</span>
                        <span class="check">✓</span>
                    </label>

                    <label class="priority-card">
                        <input type="checkbox" value="Study">
                        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5a3 3 0 0 1 3-2h13v17H7a3 3 0 0 0-3 3V5Z" />
                                <path d="M7 20h13M8 7h8M8 11h6" />
                            </svg></span>
                        <span>Study</span>
                        <span class="check">✓</span>
                    </label>

                    <label class="priority-card">
                        <input type="checkbox" value="Goals">
                        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="8" />
                                <circle cx="12" cy="12" r="4" />
                                <path d="m16 8 4-4M16 4h4v4" />
                            </svg></span>
                        <span>Goals</span>
                        <span class="check">✓</span>
                    </label>

                    <label class="priority-card">
                        <input type="checkbox" value="Personal Growth">
                        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="5" r="2" />
                                <path d="M8 21c0-4 1-7 4-9 3 2 4 5 4 9M9 11l3 2 3-2M5 15h14" />
                            </svg></span>
                        <span>Personal<br>Growth</span>
                        <span class="check">✓</span>
                    </label>
                </div>
                <div class="btns">
                    <button class="back-btn" type="button"> ← Back </button>
                    <button class="next-btn" type="button"> Continue → </button>
                </div>
            </div>
        </div>


        <div class="steps" id="step-3">
            <div class="img-form">
                <p class="eyebrow">Step 3 out of 4</p>
                <h1>Build your typical day</h1>
                <div class="day-builder">
                    <label for="wake-up">Wake up :</label>
                    <input type="time" id="wake-up" name="wake-up" required>

                    <label for="work">college / Work :</label>
                    <input type="time" id="work" name="work" required>

                    <label for="gym">Gym :</label>
                    <input type="time" id="gym" name="gym" required>

                    <label for="focus">Focus time:</label>
                    <input type="time" id="focus" name="focus" required>

                    <label for="sleep">Sleep :</label>
                    <input type="time" id="sleep" name="sleep" required>
                </div>
                <div class="btns">
                    <button class="back-btn" type="button"> ← Back </button>
                    <button class="next-btn" type="button"> Continue → </button>
                </div>
            </div>
        </div>

        <div class="steps" id="step-4">
            <div class="img-form">
                <p class="eyebrow">Step 4 out of 4</p>
                <h1>Complete your setup</h1>
                <h2>you're all set!</h2>

                <div class="btns">
                    <button class="back-btn" type="button"> ← Back </button>
                    <a id="dashboard-btn" class="next-btn" href="./pages/dashboard.html"> Go to Dashboard → </a>
                </div>
            </div>

        </div>
    </section>

    <script src="./js/main.js"></script>
</body>

</html>
